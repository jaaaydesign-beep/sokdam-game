<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>속담 비행기 — 일시정지 오버레이</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/game.css">
</head>
<body>
<div class="scr" style="width:390px;height:844px">
<div class="cloud soft" style="left:24px;top:230px"></div>
<div class="cloud soft sm" style="left:280px;top:300px"></div>
<div class="cloud soft lg" style="left:150px;top:470px"></div>
<div class="cloud soft sm" style="left:20px;top:560px"></div>
<header style="position:absolute;left:0;top:0;width:390px;padding:14px 16px 0;display:flex;flex-direction:column;gap:12px">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div class="chip">3단계</div>
    <div class="hearts" style="display:flex;gap:4px"><svg class="heart on" viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><path d="M16 28.5 5.2 18.2C1.4 14.6 1.6 8.4 5.8 5.4c3.3-2.4 7.6-1.5 10.2 1.9 2.6-3.4 6.9-4.3 10.2-1.9 4.2 3 4.4 9.2.6 12.8z" fill="#FF5E7E" stroke="#E23A5E" stroke-width="2" stroke-linejoin="round"/></svg><svg class="heart on" viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><path d="M16 28.5 5.2 18.2C1.4 14.6 1.6 8.4 5.8 5.4c3.3-2.4 7.6-1.5 10.2 1.9 2.6-3.4 6.9-4.3 10.2-1.9 4.2 3 4.4 9.2.6 12.8z" fill="#FF5E7E" stroke="#E23A5E" stroke-width="2" stroke-linejoin="round"/></svg><svg class="heart on" viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><path d="M16 28.5 5.2 18.2C1.4 14.6 1.6 8.4 5.8 5.4c3.3-2.4 7.6-1.5 10.2 1.9 2.6-3.4 6.9-4.3 10.2-1.9 4.2 3 4.4 9.2.6 12.8z" fill="#FF5E7E" stroke="#E23A5E" stroke-width="2" stroke-linejoin="round"/></svg></div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" aria-label="일시정지"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="2.5" fill="#2B3A55"/><rect x="14" y="4" width="5" height="16" rx="2.5" fill="#2B3A55"/></svg></button>
      <button class="icon-btn" aria-label="소리 끄기"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" fill="#2B3A55" stroke="#2B3A55" stroke-width="1.5" stroke-linejoin="round"/><path d="M15.5 9.5a4 4 0 0 1 0 5M18 7a7.5 7.5 0 0 1 0 10" stroke="#2B3A55" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <div class="quiz"><span>소 잃고</span><div class="cells"><div class="cell "></div><div class="cell "></div><div class="cell "></div></div><span>고친다</span></div>
</header>
<div class="lanes" style="top:172px;height:440px"><div class="lane" style="left:0"></div><div class="lane" style="left:78px"></div><div class="lane" style="left:156px"></div><div class="lane" style="left:234px"></div><div class="lane" style="left:312px"></div>
<div class="balloon b-pink" style="left:84px;top:24px;transform:rotate(-6deg)">외<span class="str"></span></div><div class="balloon b-mint" style="left:240px;top:96px;transform:rotate(5deg)">양<span class="str"></span></div><div class="balloon b-yellow" style="left:6px;top:210px;transform:rotate(-3deg)">간<span class="str"></span></div><div class="balloon b-lav" style="left:318px;top:300px;transform:rotate(6deg)">소<span class="str"></span></div><svg class="bomb" style="left:163px;top:170px" viewBox="0 0 64 80" width="64" height="80" role="img" aria-label="폭탄">
 <path class="fuse" d="M36 16 C40 8 46 10 50 6" stroke="#8B5E3C" stroke-width="4" fill="none" stroke-linecap="round"/>
 <g class="spark"><polygon points="52,0 54,5 59,5 55,8 57,13 52,10 47,13 49,8 45,5 50,5" fill="#FFD24D" stroke="#FF9F1C" stroke-width="1.5" stroke-linejoin="round"/></g>
 <rect x="25" y="12" width="16" height="12" rx="5" fill="#64748B"/>
 <circle cx="32" cy="50" r="28" fill="#4A5568"/>
 <ellipse cx="19" cy="38" rx="6" ry="10" fill="#8B98B0" opacity=".55" transform="rotate(-28 19 38)"/>
 <circle cx="23" cy="48" r="6.5" fill="#fff"/><circle cx="41" cy="48" r="6.5" fill="#fff"/>
 <circle cx="25" cy="49" r="3" fill="#2B3A55"/><circle cx="43" cy="49" r="3" fill="#2B3A55"/>
 <path d="M23 62 q4.5 -5 9 0 t9 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
 <circle cx="15" cy="58" r="3" fill="#FF9FB4" opacity=".8"/><circle cx="49" cy="58" r="3" fill="#FF9FB4" opacity=".8"/>
</svg></div>
<div class="plane top" style="left:153px;top:596px;width:84px;height:93px"><img src="../assets/bunny_happy.png" alt="토끼 비행기" style="position:absolute;left:-4px;top:4px;width:93px;height:84px;transform:rotate(90deg)"></div>
<div class="controls" style="position:absolute;left:0;bottom:0;width:390px;padding:0 16px 20px;display:flex;justify-content:space-between;gap:14px">
  <button class="btn mint arrow" aria-label="왼쪽으로"><svg viewBox="0 0 24 24" width="46" height="46" aria-hidden="true"><path d="M15 5 L5 12 L15 19 Z" fill="#174A3E" stroke="#174A3E" stroke-width="2" stroke-linejoin="round"/></svg></button>
  <button class="btn mint arrow" aria-label="오른쪽으로"><svg viewBox="0 0 24 24" width="46" height="46" aria-hidden="true"><path d="M9 5 L19 12 L9 19 Z" fill="#174A3E" stroke="#174A3E" stroke-width="2" stroke-linejoin="round"/></svg></button>
</div>

<div class="dim"></div>
<div style="position:absolute;left:0;top:0;width:390px;height:844px;display:flex;align-items:center;justify-content:center;padding:0 28px">
  <div class="card" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:30px">
    <div class="icon-btn" style="width:72px;height:72px;border-radius:36px;background:#F3F8FF;box-shadow:none" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="2.5" fill="#2B3A55"/><rect x="14" y="4" width="5" height="16" rx="2.5" fill="#2B3A55"/></svg>
    </div>
    <h2 style="margin:0;font-size:38px;font-weight:400;color:#2B3A55">잠깐 쉬어요</h2>
    <button class="btn"><svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="#4A2E12"/></svg>이어하기</button>
    <button class="btn white"><svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M4 11.5 12 4.5l8 7V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z" fill="none" stroke="#2B3A55" stroke-width="2.4" stroke-linejoin="round"/></svg>처음으로</button>
  </div>
</div>
</div>
</body>
</html>
