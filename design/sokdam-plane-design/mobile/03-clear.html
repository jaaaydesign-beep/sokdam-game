<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>속담 비행기 — 클리어 카드</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/game.css">
</head>
<body>
<div class="scr" style="width:390px;height:844px">
<div class="cloud soft" style="left:40px;top:300px"></div>
<div class="cloud soft sm" style="left:290px;top:560px"></div>
<div class="confetti" style="left:30px;top:80px;background:#FF7A6B;transform:rotate(-20deg)"></div><div class="confetti" style="left:90px;top:40px;background:#FFD24D;transform:rotate(30deg)"></div><div class="confetti" style="left:160px;top:110px;background:#9BEAD2;transform:rotate(60deg)"></div><div class="confetti" style="left:230px;top:50px;background:#CDBDFF;transform:rotate(-40deg)"></div><div class="confetti" style="left:300px;top:90px;background:#9DD6FF;transform:rotate(15deg)"></div><div class="confetti" style="left:350px;top:150px;background:#FFA1C0;transform:rotate(50deg)"></div><div class="confetti" style="left:50px;top:200px;background:#FF7A6B;transform:rotate(70deg)"></div><div class="confetti" style="left:330px;top:230px;background:#FFD24D;transform:rotate(-25deg)"></div><div class="confetti" style="left:20px;top:640px;background:#9BEAD2;transform:rotate(40deg)"></div><div class="confetti" style="left:120px;top:700px;background:#CDBDFF;transform:rotate(-30deg)"></div><div class="confetti" style="left:260px;top:680px;background:#9DD6FF;transform:rotate(20deg)"></div><div class="confetti" style="left:355px;top:600px;background:#FFA1C0;transform:rotate(-60deg)"></div><div class="confetti" style="left:200px;top:760px;background:#FF7A6B;transform:rotate(35deg)"></div><div class="confetti" style="left:70px;top:760px;background:#FFD24D;transform:rotate(-15deg)"></div><div class="confetti" style="left:310px;top:740px;background:#9BEAD2;transform:rotate(65deg)"></div><div style="position:absolute;left:40px;top:150px"><svg class="star" viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="#FFD24D" stroke="#E0A800" stroke-width="1.5" stroke-linejoin="round"/></svg></div><div style="position:absolute;left:320px;top:120px"><svg class="star" viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="#FFD24D" stroke="#E0A800" stroke-width="1.5" stroke-linejoin="round"/></svg></div><div style="position:absolute;left:300px;top:720px"><svg class="star" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="#FFD24D" stroke="#E0A800" stroke-width="1.5" stroke-linejoin="round"/></svg></div><div style="position:absolute;left:50px;top:690px"><svg class="star" viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="#FFD24D" stroke="#E0A800" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
<div style="position:absolute;left:0;top:0;width:390px;height:844px;display:flex;align-items:center;justify-content:center;padding:0 20px">
  <div class="card" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;position:relative">
    <img class="plane side" src="../assets/bunny_happy.png" alt="토끼 비행기" style="left:-40px;top:-96px;transform:rotate(-14deg);width:128px;height:116px">
    <div class="ribbon">정답이에요!</div>
    <div style="display:flex;gap:6px"><svg class="star" viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="#FFD24D" stroke="#E0A800" stroke-width="1.5" stroke-linejoin="round"/></svg><svg class="star" viewBox="0 0 24 24" width="52" height="52" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="#FFD24D" stroke="#E0A800" stroke-width="1.5" stroke-linejoin="round"/></svg><svg class="star" viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="#FFD24D" stroke="#E0A800" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
    <p style="margin:0;font-size:34px;line-height:1.35;text-align:center;color:#2B3A55">소 잃고 <span class="hl">외양간</span> 고친다</p>
    <div class="meaning" style="width:100%;text-align:center">일이 잘못된 다음에 고치면<br>이미 늦었다는 말이에요.</div>
    <button class="btn" style="margin-top:6px">다음으로<svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M5 12h13M12.5 6l6 6-6 6" fill="none" stroke="#4A2E12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>
</div>
</body>
</html>
