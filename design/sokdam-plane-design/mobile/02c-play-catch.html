<!doctype html>
<html lang="ko">

  <div style="position:absolute;left:36px;top:18px;width:6px;height:18px;border-radius:3px;background:#FFB400"></div>
  <div style="position:absolute;left:36px;top:112px;width:6px;height:18px;border-radius:3px;background:#FFB400"></div>
  <div style="position:absolute;left:-10px;top:66px;width:18px;height:6px;border-radius:3px;background:#FFB400"></div>
  <div style="position:absolute;left:70px;top:66px;width:18px;height:6px;border-radius:3px;background:#FFB400"></div>
  <div style="position:absolute;left:4px;top:30px;width:8px;height:8px;border-radius:50%;background:#FF7A6B"></div>
  <div style="position:absolute;left:66px;top:28px;width:8px;height:8px;border-radius:50%;background:#9BEAD2"></div>

<div style="position:absolute;left:236px;top:160px;font-size:26px;color:#FF7A6B;transform:rotate(12deg)">+1</div>

</div>
