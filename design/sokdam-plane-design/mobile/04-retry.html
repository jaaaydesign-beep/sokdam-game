<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>속담 비행기 — 다시 하기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/game.css">
</head>
<body>
<div class="scr" style="width:390px;height:844px;background:linear-gradient(180deg,#C9DFF0 0%,#DFEDF8 55%,#EEF6FC 100%)">
<div class="cloud soft lg" style="left:40px;top:120px"></div>
<div class="cloud soft" style="left:270px;top:200px"></div>
<div class="cloud soft sm" style="left:30px;top:620px"></div>
<div style="position:absolute;left:0;top:0;width:390px;height:844px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 28px">
  <div class="hearts" style="display:flex;gap:6px"><svg class="heart off" viewBox="0 0 32 32" width="40" height="40" aria-hidden="true"><path d="M16 28.5 5.2 18.2C1.4 14.6 1.6 8.4 5.8 5.4c3.3-2.4 7.6-1.5 10.2 1.9 2.6-3.4 6.9-4.3 10.2-1.9 4.2 3 4.4 9.2.6 12.8z" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="2" stroke-linejoin="round"/></svg><svg class="heart off" viewBox="0 0 32 32" width="40" height="40" aria-hidden="true"><path d="M16 28.5 5.2 18.2C1.4 14.6 1.6 8.4 5.8 5.4c3.3-2.4 7.6-1.5 10.2 1.9 2.6-3.4 6.9-4.3 10.2-1.9 4.2 3 4.4 9.2.6 12.8z" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="2" stroke-linejoin="round"/></svg><svg class="heart off" viewBox="0 0 32 32" width="40" height="40" aria-hidden="true"><path d="M16 28.5 5.2 18.2C1.4 14.6 1.6 8.4 5.8 5.4c3.3-2.4 7.6-1.5 10.2 1.9 2.6-3.4 6.9-4.3 10.2-1.9 4.2 3 4.4 9.2.6 12.8z" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="2" stroke-linejoin="round"/></svg></div>
  <div style="position:relative;width:220px;height:230px">
    <div class="cloud lg" style="left:50px;top:200px"></div>
    <img class="plane side" src="../assets/bunny_sad.png" alt="토끼 비행기" style="left:-5px;top:40px;transform:rotate(14deg);width:218px;height:161px">
  </div>
  <h1 style="margin:0;font-size:52px;font-weight:400;line-height:1.1;color:#2B3A55;text-shadow:0 4px 0 #fff">괜찮아!</h1>
  <p style="margin:0;font-size:30px;color:#3B4A66">다시 해보자</p>
  <button class="btn" style="margin-top:10px;font-size:38px"><svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.1-5" fill="none" stroke="#4A2E12" stroke-width="2.6" stroke-linecap="round"/><path d="M17.5 3.5v4h-4" fill="none" stroke="#4A2E12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>다시 하기</button>
  <button class="linkish">처음으로</button>
</div>
</div>
</body>
</html>
