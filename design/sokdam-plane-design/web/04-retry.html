<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>속담 비행기 — 웹 — 다시 하기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/game.css">
</head>
<body>
<div class="wscr" style="width:1440px;height:900px;background:linear-gradient(180deg,#BFD9EC 0%,#DAEAF6 50%,#EEF6FC 100%)">
<div class="cloud lg" style="left:120px;top:140px"></div>
<div class="cloud sm soft" style="left:300px;top:70px"></div>
<div class="cloud soft" style="left:1120px;top:110px"></div>
<div class="cloud lg soft" style="left:1200px;top:520px"></div>
<div class="cloud sm soft" style="left:80px;top:600px"></div><div class="hill" style="left:-200px;top:780px;width:900px;height:400px"></div>
<div class="hill b" style="left:500px;top:810px;width:700px;height:360px"></div>
<div class="hill" style="left:1000px;top:770px;width:800px;height:420px"></div>
<div style="position:absolute;left:0;top:0;width:1440px;height:900px;display:flex;align-items:center;justify-content:center;gap:80px">
  <div style="position:relative;width:340px;height:340px">
    <div class="cloud lg" style="left:90px;top:300px"></div>
    <img class="plane side" src="../assets/bunny_sad.png" alt="토끼 비행기" style="left:-10px;top:60px;transform:rotate(14deg);width:342px;height:253px">
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:18px;width:480px">
    <div class="hearts" style="display:flex;gap:8px"><svg class="heart off" viewBox="0 0 32 32" width="52" height="52" aria-hidden="true"><path d="M16 28.5 5.2 18.2C1.4 14.6 1.6 8.4 5.8 5.4c3.3-2.4 7.6-1.5 10.2 1.9 2.6-3.4 6.9-4.3 10.2-1.9 4.2 3 4.4 9.2.6 12.8z" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="2" stroke-linejoin="round"/></svg><svg class="heart off" viewBox="0 0 32 32" width="52" height="52" aria-hidden="true"><path d="M16 28.5 5.2 18.2C1.4 14.6 1.6 8.4 5.8 5.4c3.3-2.4 7.6-1.5 10.2 1.9 2.6-3.4 6.9-4.3 10.2-1.9 4.2 3 4.4 9.2.6 12.8z" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="2" stroke-linejoin="round"/></svg><svg class="heart off" viewBox="0 0 32 32" width="52" height="52" aria-hidden="true"><path d="M16 28.5 5.2 18.2C1.4 14.6 1.6 8.4 5.8 5.4c3.3-2.4 7.6-1.5 10.2 1.9 2.6-3.4 6.9-4.3 10.2-1.9 4.2 3 4.4 9.2.6 12.8z" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="2" stroke-linejoin="round"/></svg></div>
    <h1 style="margin:0;font-size:84px;font-weight:400;line-height:1.05;text-shadow:0 6px 0 #fff">괜찮아!</h1>
    <p style="margin:0;font-size:40px;color:#3B4A66">다시 해보자</p>
    <button class="btn" style="margin-top:8px;height:108px;font-size:44px"><svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.1-5" fill="none" stroke="#4A2E12" stroke-width="2.6" stroke-linecap="round"/><path d="M17.5 3.5v4h-4" fill="none" stroke="#4A2E12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>다시 하기</button>
    <button class="linkish" style="font-size:28px">처음으로</button>
  </div>
</div>
</div>
